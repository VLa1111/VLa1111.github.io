<title id="title">PR 10376 输出一致性对比</title><desc id="desc">50步等长与混合长度批次比较：PSNR从27.66提升至45.16 dB，SSIM从0.964提升至0.997。20步测试中批大小2至4的每步耗时未变。</desc>
